<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex Explorer</title>
  <!-- Fonte Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="pokedex-wrapper">
    <!-- Cabeçalho -->
    <header class="pokedex-header">
      <div class="pokeball-logo"></div>
      <h1>Pokédex</h1>
      <p>Busque um Pokémon pelo nome ou número</p>
    </header>

    <!-- Área de Busca: Input + Botões Lado a Lado -->
    <section class="search-section">
      <input 
        type="text" 
        id="campo-busca" 
        placeholder="Digite o nome ou ID (ex: 129)..." 
        autocomplete="off"
      >
      <div class="button-group">
        <button id="botao-buscar" class="btn-buscar">Buscar</button>
        <button id="botao-aleatorio" class="btn-aleatorio">🎲 Aleatório</button>
      </div>
    </section>

    <!-- Área de Exibição / Resultados / Mensagem de Erro -->
    <main id="resultado" class="result-container">
      <div class="placeholder-state">
        <div class="placeholder-icon">🔎</div>
        <p>Digite o nome/ID ou clique em <strong>Aleatório</strong> para sortear um Pokémon.</p>
      </div>
    </main>

    <!-- Rodapé -->
    <footer class="pokedex-footer">
      <p>Dados fornecidos pela <a href="https://pokeapi.co/" target="_blank">PokeAPI</a> · Projeto da disciplina Bootcamp II — Etapa 01</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
